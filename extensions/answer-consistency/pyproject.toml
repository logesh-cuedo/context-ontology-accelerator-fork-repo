[project]
name = "coa-answer-consistency"
version = "0.1.0"
description = "Same question, same answer: per-namespace SQL rules, fixed sampling and an SQL cache for serve"
requires-python = ">=3.12"
# boto3 and structlog are already in serve's image; serve's Dockerfile installs this package with --no-deps.
dependencies = ["boto3>=1.35.0", "structlog>=24.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coa_consistency"]
