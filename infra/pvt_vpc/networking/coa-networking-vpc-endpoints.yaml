      - Key: Project
        Value: !Ref ProjectTag
      - Key: Environment
        Value: !Ref EnvName
      - Key: Component
        Value: foundation

  # Step Functions
  # --------------------------------------------------------------------------
  StepFunctionsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.states'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref PrivateSubnetIds
      SecurityGroupIds:
      - !Ref InterfaceEndpointSecurityGroupId
      Tags:
      - Key: Name
        Value: !Sub '${Prefix}-${EnvName}-vpce-states'
      - Key: Project
        Value: !Ref ProjectTag
      - Key: Environment
        Value: !Ref EnvName
      - Key: Component
        Value: foundation

  # Athena - federated query
  # --------------------------------------------------------------------------
  AthenaEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.athena'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref PrivateSubnetIds
      SecurityGroupIds:
      - !Ref InterfaceEndpointSecurityGroupId
      Tags:
      - Key: Name
        Value: !Sub '${Prefix}-${EnvName}-vpce-athena'
      - Key: Project
        Value: !Ref ProjectTag
      - Key: Environment
        Value: !Ref EnvName
      - Key: Component
