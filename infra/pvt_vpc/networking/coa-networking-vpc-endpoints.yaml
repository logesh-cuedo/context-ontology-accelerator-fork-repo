        Value: !Sub '${Prefix}-${EnvName}-vpce-neptune-graph-data'
      - Key: Project
        Value: !Ref ProjectTag
      - Key: Environment
        Value: !Ref EnvName
      - Key: Component
        Value: foundation

Outputs:
  AossDataVpcEndpointId:
    Value: !Ref AossDataEndpoint
    Description: >-
      -> config.json  vpcEndpoints.aossData  (REQUIRED: the OpenSearch
      collection's network policy is built from this, and the deployment fails
      without it)
